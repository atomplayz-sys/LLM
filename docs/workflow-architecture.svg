<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#08090A; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141517"/>
      <stop offset="100%" stop-color="#0E0F10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27A644"/>
      <stop offset="100%" stop-color="#1E8236"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16181A" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.7"/>

  <!-- Top Header / Title Badge -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#181A1C" stroke="#292B2E" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#27A644"/>
    <text x="28" y="18" fill="#F7F8F8" font-size="12" font-weight="600" letter-spacing="0.5">SYSTEM ARCHITECTURE</text>
    
    <text x="0" y="65" fill="#F7F8F8" font-size="28" font-weight="700" letter-spacing="-0.5">Personal LLM — End-to-End Inference Workflow</text>
    <text x="0" y="90" fill="#717780" font-size="14" font-weight="400">Production-grade local AI stack with prompt defense, FastAPI async pipeline, and LoRA adapter execution</text>
  </g>

  <!-- Workflow Steps Container (4 Columns) -->
  
  <!-- STEP 1: CLIENT WORKSPACE -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="245" height="420" rx="10" fill="url(#cardGrad)" stroke="#292B2E" stroke-width="1"/>
    <!-- Step Header -->
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#1C1E20" stroke="#292B2E"/>
    <text x="31" y="41" fill="#27A644" font-size="14" font-weight="700">01</text>
    <text x="64" y="34" fill="#F7F8F8" font-size="16" font-weight="600">Client Workspace</text>
    <text x="64" y="50" fill="#717780" font-size="12">Linear-Inspired UI</text>
    <line x1="20" y1="68" x2="225" y2="68" stroke="#202225" stroke-width="1"/>

    <!-- Content Items -->
    <g transform="translate(20, 85)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Monochromatic Chat UI</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Dark #08090A aesthetic</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Markdown &amp; Highlight.js</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Code syntax highlighting</text>
    </g>

    <g transform="translate(20, 215)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Multi-Turn History</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">LocalStorage persistence</text>
    </g>

    <g transform="translate(20, 280)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Real-Time Controls</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Temperature, tokens, penalty</text>
    </g>

    <!-- Bottom Tag -->
    <rect x="20" y="365" width="205" height="32" rx="6" fill="#19251C" stroke="#27A644" stroke-opacity="0.3"/>
    <text x="122" y="385" fill="#27A644" font-size="11" font-weight="600" text-anchor="middle">HTTP POST /api/v1/chat ➔</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 315 370 L 345 370" stroke="#27A644" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="345,365 355,370 345,375" fill="#27A644"/>

  <!-- STEP 2: SECURITY & GATEWAY -->
  <g transform="translate(360, 160)" filter="url(#cardShadow)">
    <rect width="245" height="420" rx="10" fill="url(#cardGrad)" stroke="#292B2E" stroke-width="1"/>
    <!-- Step Header -->
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#1C1E20" stroke="#292B2E"/>
    <text x="31" y="41" fill="#27A644" font-size="14" font-weight="700">02</text>
    <text x="64" y="34" fill="#F7F8F8" font-size="16" font-weight="600">FastAPI Gateway</text>
    <text x="64" y="50" fill="#717780" font-size="12">Security &amp; Boundaries</text>
    <line x1="20" y1="68" x2="225" y2="68" stroke="#202225" stroke-width="1"/>

    <!-- Content Items -->
    <g transform="translate(20, 85)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Rate Limiter (SlowAPI)</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">10 req/min per remote IP</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Payload Boundary (1MB)</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Rejects buffer overflow attempts</text>
    </g>

    <g transform="translate(20, 215)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Constant-Time Auth</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Timing-attack safe hmac check</text>
    </g>

    <g transform="translate(20, 280)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Pydantic v2 Schemas</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Strict range &amp; type validation</text>
    </g>

    <!-- Bottom Tag -->
    <rect x="20" y="365" width="205" height="32" rx="6" fill="#19251C" stroke="#27A644" stroke-opacity="0.3"/>
    <text x="122" y="385" fill="#27A644" font-size="11" font-weight="600" text-anchor="middle">Validated Request Payload ➔</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 615 370 L 645 370" stroke="#27A644" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="645,365 655,370 645,375" fill="#27A644"/>

  <!-- STEP 3: SANITIZATION & PROMPT INJECTION DEFENSE -->
  <g transform="translate(660, 160)" filter="url(#cardShadow)">
    <rect width="245" height="420" rx="10" fill="url(#cardGrad)" stroke="#292B2E" stroke-width="1"/>
    <!-- Step Header -->
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#1C1E20" stroke="#292B2E"/>
    <text x="31" y="41" fill="#27A644" font-size="14" font-weight="700">03</text>
    <text x="64" y="34" fill="#F7F8F8" font-size="16" font-weight="600">Prompt Defense</text>
    <text x="64" y="50" fill="#717780" font-size="12">Injection Sanitizer</text>
    <line x1="20" y1="68" x2="225" y2="68" stroke="#202225" stroke-width="1"/>

    <!-- Content Items -->
    <g transform="translate(20, 85)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Control Token Stripping</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Filters &lt;|system|&gt;, &lt;|user|&gt;, &lt;/s&gt;</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Evasion Hack Blocking</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Detects whitespace &amp; case tricks</text>
    </g>

    <g transform="translate(20, 215)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">ChatML Prompt Format</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Enforces trusted system prompt</text>
    </g>

    <g transform="translate(20, 280)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Max Token Boundary</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Truncates excess context window</text>
    </g>

    <!-- Bottom Tag -->
    <rect x="20" y="365" width="205" height="32" rx="6" fill="#19251C" stroke="#27A644" stroke-opacity="0.3"/>
    <text x="122" y="385" fill="#27A644" font-size="11" font-weight="600" text-anchor="middle">Sanitized Prompt Tokens ➔</text>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M 915 370 L 945 370" stroke="#27A644" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="945,365 955,370 945,375" fill="#27A644"/>

  <!-- STEP 4: MODEL & HARDWARE INFERENCE -->
  <g transform="translate(960, 160)" filter="url(#cardShadow)">
    <rect width="245" height="420" rx="10" fill="url(#cardGrad)" stroke="#292B2E" stroke-width="1"/>
    <!-- Step Header -->
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#1C1E20" stroke="#292B2E"/>
    <text x="31" y="41" fill="#27A644" font-size="14" font-weight="700">04</text>
    <text x="64" y="34" fill="#F7F8F8" font-size="16" font-weight="600">LLM Inference</text>
    <text x="64" y="50" fill="#717780" font-size="12">PyTorch &amp; LoRA Runtime</text>
    <line x1="20" y1="68" x2="225" y2="68" stroke="#202225" stroke-width="1"/>

    <!-- Content Items -->
    <g transform="translate(20, 85)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">TinyLlama-1.1B Base</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Causal LM with rotary embeddings</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">LoRA Adapter (r=8)</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Trained on Open-Platypus QA</text>
    </g>

    <g transform="translate(20, 215)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Async Thread Pool</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">asyncio.to_thread non-blocking</text>
    </g>

    <g transform="translate(20, 280)">
      <rect width="205" height="54" rx="6" fill="#161719" stroke="#232528"/>
      <text x="14" y="24" fill="#F7F8F8" font-size="12" font-weight="600">Cross-Platform Runtime</text>
      <text x="14" y="42" fill="#A1A1AA" font-size="11">Apple MPS / NVIDIA CUDA / CPU</text>
    </g>

    <!-- Bottom Tag -->
    <rect x="20" y="365" width="205" height="32" rx="6" fill="#19251C" stroke="#27A644" stroke-opacity="0.3"/>
    <text x="122" y="385" fill="#27A644" font-size="11" font-weight="600" text-anchor="middle">✔ Stream Formatted Answer</text>
  </g>

  <!-- Footer Metadata & Watermark -->
  <g transform="translate(60, 620)">
    <text x="0" y="20" fill="#717780" font-size="12">GitHub: https://github.com/atomplayz-sys/LLM</text>
    <text x="1080" y="20" fill="#717780" font-size="12" text-anchor="end">42/42 Tests Passing • PyTorch • FastAPI • LoRA</text>
  </g>
</svg>
