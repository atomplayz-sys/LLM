base_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
dataset:
  name: "garage-bAInd/Open-Platypus"
  split: "train"
  max_samples: null
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
training:
  epochs: 3
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_seq_length: 512
  fp16: false
  bf16: false
  logging_steps: 10
  save_steps: 200
  save_total_limit: 2
device: "mps"
quantization:
  enabled: false
output_dir: "./output"
logging_dir: "./logs"
